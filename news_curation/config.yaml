# News Curation Pipeline Configuration
# Bump `version` to create a new dataset version under output/{version}/

version: "v5"
year_month: "2025/09"   # Common Crawl News dump to ingest

# Random seeds for reproducibility
seed: 42

# Output directory (version is appended automatically)
output_dir: "./output"

# --- Stage 1: WARC download ---
download:
  workers: 20

# --- Stage 2: Article extraction ---
extract:
  languages: "english"  # "english" | "nonenglish" | "all"
  workers: 40
  min_text_length: 50

# --- Stage 3: Cleanup + dedup ---
cleanup:
  min_text_length: 100   # chars
  min_word_count: 20
  dedup_threshold: 0.95
  dedup_num_perm: 128
  dedup_shingle_size: 7
  dedup_workers: 40

# --- Stage 4: Embeddings ---
# Defaults match the original cluster_corpus config used by local clustering
# (title + first paragraph, 512 tokens max). Change these if you want to
# produce embeddings for a different downstream use (e.g. doc retrieval).
embeddings:
  model: "google/embeddinggemma-300m"
  max_seq_length: 512
  batch_size: 512
  prefix: "task: clustering | query: "
  input_mode: "title_lede"   # "title_and_text" | "text_only" | "title_lede" | "doc_prefix"
  num_gpus: 4

# --- Stage 5: Local clustering ---
clustering:
  window_days: 3
  window_step: 1
  k_search: 60
  k_graph: 30
  sim_threshold: 0.55
  leiden_resolution: 0.07
  leiden_iterations: 4
  leiden_seed: 42
  min_cluster_size: 25
  jaccard_threshold: 0.25
  centroid_threshold: 0.8
  span_cap_days: 7

# --- Stages 6-7: Fact extraction prompts ---
facts:
  max_articles: 50
  max_chars: 512
  top_k_clusters: 500
  min_articles: 3

# --- Stages 8-9: QA generation prompts ---
qa_generation:
  max_articles: 50
  max_chars: 512
  top_k_clusters: 500

# --- Stages 10-11: Zero-shot evaluation ---
zeroshot:
  model_label: "0shot_bestguess_gemini-2.5-pro"

# --- Stages 12-13: Judge ---
judge:
  # No tunable params; the prompt and merging logic are fixed.

# --- Stages 14-16: Support check ---
# Defaults mirror the original news pipeline:
#   - QA embeds (fact + question) — 512 seq, batch 512, single-GPU is fine
#   - Doc embeds — 1024-token text cap, 1100 seq, batch 128, multi-GPU recommended
support:
  good_qa_filter:
    require_zeroshot_wrong: true   # is_zeroshot_correct == false
    require_specified: true        # is_underspecified == false

  # Stage 14a — fact embeds: encode "{question} {answer}" with fact-checking prefix
  fact_embeds:
    model: "google/embeddinggemma-300m"
    prefix: "task: fact checking | query: "
    max_seq_length: 512
    batch_size: 512

  # Stage 14b — question embeds: encode "{question}" with question-answering prefix
  question_embeds:
    model: "google/embeddinggemma-300m"
    prefix: "task: question answering | query: "
    max_seq_length: 512
    batch_size: 512

  # Stage 14c — doc embeds: encode "title: {title} | text: {text[:1024 tok]}"
  # with the clustering prefix. Body is truncated to max_text_tokens via the
  # model's tokenizer before formatting.
  doc_embeds:
    model: "google/embeddinggemma-300m"
    prefix: "task: clustering | query: "
    doc_prefix: "title: {article_title} | text: {text}"
    max_text_tokens: 1024
    max_seq_length: 1100
    batch_size: 128
    tokenize_workers: 32

  # Stage 15 — retrieval params (used by find_doc / save_support_prompts)
  retrieval:
    top_k: 1000
    sim_threshold: 0.7
    doc_batch: 200000   # docs per similarity batch (memory cap on the (Q,B) matrix)

  # Stage 15 — final prompt construction
  prompt:
    max_text_tokens: 1024   # how many text tokens to include per article in the LLM prompts

# --- Stage 17: Stats ---
stats:
  tokenizer: "gemma3"   # "gemma3" | "whitespace"
